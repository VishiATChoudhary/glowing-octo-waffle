<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
  <!-- Outer circle -->
  <circle cx="100" cy="100" r="95" />

  <!-- Vertical divider -->
  <line x1="100" y1="5" x2="100" y2="195" />

  <!-- Horizontal divider -->
  <line x1="5" y1="100" x2="195" y2="100" />

  <!-- Top-left quadrant waffle squares -->
  <rect x="20" y="20" width="20" height="20" />
  <rect x="50" y="20" width="20" height="20" />
  <rect x="20" y="50" width="20" height="20" />
  <rect x="50" y="50" width="20" height="20" />
  <rect x="75" y="35" width="15" height="15" />
  <rect x="30" y="75" width="15" height="15" />

  <!-- Top-right quadrant waffle squares -->
  <rect x="130" y="20" width="20" height="20" />
  <rect x="160" y="20" width="20" height="20" />
  <rect x="130" y="50" width="20" height="20" />
  <rect x="160" y="50" width="20" height="20" />
  <rect x="110" y="35" width="15" height="15" />
  <rect x="155" y="75" width="15" height="15" />

  <!-- Bottom-left quadrant waffle squares -->
  <rect x="20" y="130" width="20" height="20" />
  <rect x="50" y="130" width="20" height="20" />
  <rect x="20" y="160" width="20" height="20" />
  <rect x="50" y="160" width="20" height="20" />
  <rect x="75" y="145" width="15" height="15" />
  <rect x="30" y="110" width="15" height="15" />

  <!-- Bottom-right quadrant waffle squares -->
  <rect x="130" y="130" width="20" height="20" />
  <rect x="160" y="130" width="20" height="20" />
  <rect x="130" y="160" width="20" height="20" />
  <rect x="160" y="160" width="20" height="20" />
  <rect x="110" y="145" width="15" height="15" />
  <rect x="155" y="110" width="15" height="15" />
</svg>
